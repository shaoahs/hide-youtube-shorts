<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- YouTube 紅色背景圓角矩形 -->
  <rect x="4" y="10" width="40" height="28" rx="6" ry="6" fill="#FF0000"/>
  <!-- 播放三角形（白色） -->
  <polygon points="20,17 20,31 34,24" fill="white"/>
  <!-- 刪除線（白色，左上到右下） -->
  <line x1="4" y1="4" x2="44" y2="44" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- 刪除線外框（讓線在紅色背景上更明顯） -->
  <line x1="4" y1="4" x2="44" y2="44" stroke="#CC0000" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
</svg>
